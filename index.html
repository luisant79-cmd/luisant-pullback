<!-- Pestañas de navegación -->
    <div class="tabs">
      <button class="tab-btn active" onclick="openTab(event, 'tab-resumen')">Resumen</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-radar')">🎯 Radar V4</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-aportaciones-tr')">Aportaciones TR</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-calendario')">Calendario P&L</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-posiciones')">Posiciones</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-operaciones')">Operaciones</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-rendimiento')">Rendimiento</button>
      <button class="tab-btn" onclick="openTab(event, 'tab-dividendos')">Dividendos</button>
    </div>

    <!-- Resto de pestañas (Resumen, Radar, etc.) que ya tienes... -->
    
  </div> <!-- Fin del container -->

  <script>
    function openTab(evt, tabId) {
      const sections = document.getElementsByClassName("tab-section");
      for (let i = 0; i < sections.length; i++) {
        sections[i].classList.remove("active-section");
      }
      const buttons = document.getElementsByClassName("tab-btn");
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
      document.getElementById(tabId).classList.add("active-section");
      evt.currentTarget.classList.add("active");
    }

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxWWn1B2a27h-Pl3y1Pb4rbt99oVw5jJOWI2xUbFksxIAJvz87Hyoi2moAMkNhpMtdkig/exec";

    function cargarDatos() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById('sync-status').innerText = '● Sincronizado';
          
          // Beneficio Noviembre
          if (data.beneficioNoviembre !== undefined) {
            let valNov = parseFloat(data.beneficioNoviembre) || 110.08;
            let elNov = document.getElementById('val-beneficio-mes');
            if (elNov) {
              elNov.innerText = (valNov >= 0 ? '+' : '') + valNov.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
              elNov.className = valNov >= 0 ? 'green-text' : 'red-text';
            }
          }

          // Aportaciones Trade Republic
          if (data.aportacionesTR && data.aportacionesTR.length > 1) {
            let totalAportado = 0;
            for (let i = 1; i < data.aportacionesTR.length; i++) {
              let val = parseFloat(data.aportacionesTR[i][2]) || 0;
              totalAportado += val;
            }
            let elAport = document.getElementById('val-aportaciones-tr');
            if (elAport) {
              elAport.innerText = totalAportado.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
            }
          }

          // Radar de Empresas V4 con Auditoría
          if (data.radar && data.radar.length > 0) {
            let tbody = document.getElementById('tabla-radar-body');
            tbody.innerHTML = '';
            
            data.radar.forEach(item => {
              let ticker = item.ticker || '';
              let empresaFase = item.empresaFase || '';
              let accion = item.accionOperativa || '';
              let mediasV4 = item.mediasV4 || '';
              let auditoriaV4 = item.auditoriaV4 || '';
              
              if (ticker.trim() !== '') {
                let badgeClass = "yellow-text";
                let accionUpper = accion.toUpperCase();
                if (accionUpper.includes("APTA") || accionUpper.includes("NIVEL 2")) {
                  badgeClass = "green-text";
                } else if (accionUpper.includes("RECHAZADA")) {
                  badgeClass = "red-text";
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                  <td style="font-weight:bold; color:var(--text);">${ticker}</td>
                  <td>${empresaFase}</td>
                  <td class="${badgeClass}" style="font-weight:bold;">${accion}</td>
                  <td style="font-size:11px;">${mediasV4}</td>
                  <td style="font-size:11px; color:var(--text-muted); font-family:monospace;">${auditoriaV4}</td>
                `;
                tbody.appendChild(tr);
              }
            });
            
            if (tbody.innerHTML === '') {
              tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No hay acciones en el radar actualmente.</td></tr>`;
            }
          }
        })
        .catch(err => {
          console.log("Cargando vista local o error de red...", err);
        });
    }

    cargarDatos();
  </script>
</body>
</html>
